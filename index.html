<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전학공 총무장부</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%92%3C/text%3E%3C/svg%3E">
<style>
  /* 깃허브 페이지 → Apps Script 웹앱 연결용 화면 (파일 이름: jeonhakgong_github_index.html) */
  html, body{ margin:0; height:100%; background:#F6F5FB; font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
  #app{ position:fixed; inset:0; width:100%; height:100%; border:0; display:block; background:#F6F5FB; }
  #cover{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:linear-gradient(135deg,#E8EDF8,#F6F5FB 45%,#FBEFF4); color:#1F2A44; transition:opacity .5s ease; z-index:2; padding:16px; text-align:center; }
  #cover.hide{ opacity:0; pointer-events:none; }
  .em{ display:flex; gap:10px; font-size:30px; }
  .em span{ display:inline-block; animation:hop 1.1s ease-in-out infinite; }
  .em span:nth-child(2){ animation-delay:.12s } .em span:nth-child(3){ animation-delay:.24s } .em span:nth-child(4){ animation-delay:.36s }
  .t{ font-weight:700; font-size:18px; }
  .s{ font-size:13px; color:#5A6480; }
  .open{ display:none; margin-top:6px; padding:10px 20px; border-radius:999px; background:#34508A; color:#fff; text-decoration:none; font-weight:600; font-size:14px;
    box-shadow:0 8px 18px -10px rgba(35,58,102,.9); }
  .open.show{ display:inline-block; }
  @keyframes hop{ 0%,100%{ transform:translateY(0) } 40%{ transform:translateY(-12px) } }
</style>
</head>
<body>
<div id="cover">
  <div class="em"><span>📒</span><span>📚</span><span>☕</span><span>💜</span></div>
  <div class="t">전학공 총무장부를 여는 중이에요</div>
  <div class="s" id="msg">잠시만 기다려 주세요…</div>
  <a class="open" id="openLink" target="_top" rel="noopener">새 창에서 열기 →</a>
</div>
<iframe id="app" title="전학공 총무장부" allow="clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
/* ▼▼▼ Apps Script 웹앱 주소 (배포 관리에 나오는 /exec 로 끝나는 주소) ▼▼▼
   프로젝트를 바꾸거나 '새 배포'로 주소가 바뀌면 이 한 줄만 고치면 됩니다. */
var APP_URL = 'https:' + '//script.google.com/macros/s/AKfycbyCMPZzeqlaBnisAt-JEQgSr0jUALs7Q4OnXqOD9J_hSONfxiMNsvjyIu-IPwVDbJ_L/exec';
/* ▲▲▲▲▲▲ */

var frame = document.getElementById('app'), cover = document.getElementById('cover');
var link = document.getElementById('openLink');
link.href = APP_URL;
frame.addEventListener('load', function(){ setTimeout(function(){ cover.classList.add('hide'); }, 300); });
frame.src = APP_URL;
/* 학교망·브라우저 설정 때문에 안쪽 화면이 막히면 새 창 버튼을 보여줌 */
setTimeout(function(){
  if(!cover.classList.contains('hide')){
    document.getElementById('msg').textContent = '화면이 열리지 않으면 아래 버튼을 눌러주세요.';
    link.classList.add('show');
  }
}, 12000);
</script>
</body>
</html>
